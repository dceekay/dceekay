<svg width="900" height="270" viewBox="0 0 900 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ceekayx animated engineering terminal</title>
  <desc id="desc">An animated terminal showing Ceekayx building reliable enterprise, cloud, and AI systems.</desc>
  <defs>
    <linearGradient id="frame" x1="40" y1="10" x2="860" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D9F5"/>
      <stop offset="0.52" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="progress" x1="34" y1="237" x2="866" y2="237" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D9F5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="terminalClip">
      <rect x="1" y="1" width="898" height="268" rx="17"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="898" height="268" rx="17" fill="#070B14" stroke="url(#frame)" stroke-width="2"/>
  <g clip-path="url(#terminalClip)">
    <rect x="0" y="0" width="900" height="46" fill="#111827"/>
    <circle cx="24" cy="23" r="6" fill="#FF5F57"/>
    <circle cx="45" cy="23" r="6" fill="#FEBC2E"/>
    <circle cx="66" cy="23" r="6" fill="#28C840"/>
    <text x="450" y="29" fill="#94A3B8" font-family="JetBrains Mono, Consolas, monospace" font-size="13" text-anchor="middle">ceekayx / production</text>

    <g font-family="JetBrains Mono, Consolas, monospace" font-size="17">
      <text x="34" y="86" fill="#00D9F5">$</text>
      <text x="55" y="86" fill="#E2E8F0">ceekayx build --system enterprise-platform</text>

      <g opacity="0">
        <text x="34" y="126" fill="#64748B">›</text>
        <text x="55" y="126" fill="#CBD5E1">architecture</text>
        <text x="200" y="126" fill="#22C55E">scalable</text>
        <text x="315" y="126" fill="#64748B">·</text>
        <text x="337" y="126" fill="#CBD5E1">security</text>
        <text x="435" y="126" fill="#22C55E">hardened</text>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.12;0.18;1" dur="6s" repeatCount="indefinite"/>
      </g>

      <g opacity="0">
        <text x="34" y="166" fill="#64748B">›</text>
        <text x="55" y="166" fill="#CBD5E1">cloud</text>
        <text x="125" y="166" fill="#22C55E">deployed</text>
        <text x="230" y="166" fill="#64748B">·</text>
        <text x="252" y="166" fill="#CBD5E1">AI workflows</text>
        <text x="390" y="166" fill="#22C55E">connected</text>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.32;0.38;1" dur="6s" repeatCount="indefinite"/>
      </g>

      <g opacity="0">
        <text x="34" y="206" fill="#7C3AED">✓</text>
        <text x="55" y="206" fill="#F8FAFC">production-ready — ship with confidence</text>
        <rect x="420" y="188" width="9" height="22" rx="1" fill="#00D9F5">
          <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
        </rect>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.53;0.59;0.94;1" dur="6s" repeatCount="indefinite"/>
      </g>
    </g>

    <rect x="34" y="235" width="832" height="4" rx="2" fill="#1E293B"/>
    <rect x="34" y="235" width="0" height="4" rx="2" fill="url(#progress)" filter="url(#glow)">
      <animate attributeName="width" values="0;832;832;0" keyTimes="0;0.78;0.94;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="851" cy="69" r="5" fill="#22C55E" filter="url(#glow)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;6;4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="836" y="73" fill="#64748B" font-family="JetBrains Mono, Consolas, monospace" font-size="11" text-anchor="end">LIVE</text>
  </g>
</svg>
